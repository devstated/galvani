; Galvani — settings shared by dev and prod.
; Apps can override any value with their own $PHP_INI_DIR/app.conf.d/zz-app.ini

expose_php = Off
memory_limit = 256M
max_execution_time = 30
post_max_size = 32M
upload_max_filesize = 32M
max_input_vars = 5000
date.timezone = UTC
variables_order = EGPCS
default_charset = UTF-8

; Errors go to stderr -> container logs
log_errors = On
error_log = /dev/stderr

; Sessions (if stored in files; prefer Valkey/DB for multi-container setups)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Realpath cache (big win in worker mode and with many classes)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; APCu (used by Symfony for metadata caches)
apc.enable_cli = 1
apc.shm_size = 64M

zend.assertions = -1
