; Galvani — production hardening.

display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED

; Code is immutable inside the image: never stat files.
opcache.validate_timestamps = 0

; TLS is terminated by the proxy, the browser always sees https.
session.cookie_secure = 1

; No remote includes, ever.
allow_url_include = Off

; Functions that a Symfony app essentially never needs at runtime but that turn
; an RCE into a shell. proc_open is kept (Symfony Process, Mailer sendmail).
; Apps that really need one can override this in app.conf.d/zz-app.ini.
disable_functions = exec,passthru,shell_exec,system,popen,pcntl_exec,dl
